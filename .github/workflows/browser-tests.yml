name: Browser tests (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wotlk
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: wow_top_gear
        ports: ["55435:5432"]
        options: >-
          --health-cmd "pg_isready -U wotlk -d wow_top_gear"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://wotlk:test-only@127.0.0.1:55435/wow_top_gear
      APP_ENV: local
      APP_ORIGIN: http://127.0.0.1:3000
      CAPABILITY_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.4
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm sim:build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests with isolated app and worker
        run: pnpm test:e2e
